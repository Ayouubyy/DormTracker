name: SUP'COM dorm watcher

# (Re-touched to force GitHub to (re-)register this schedule-triggered workflow — it
# wasn't appearing in the Actions tab or workflow API after the original push.)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Scheduled runs are best-effort and can fire late; without this, a delayed run and the
# next one could overlap, both see the same post as new (two sirens for one post) and both
# race to push state.json. Queue them instead of cancelling — a cancelled run could be
# killed mid-alert.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: python watch.py

      - name: Commit updated state
        run: |
          git config user.name "supcom-dorm-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "Update watcher state [skip ci]"
          # Rebase onto anything that landed while we were running, so a genuine race
          # retries instead of failing the push and reddening the workflow.
          git pull --rebase --autostash
          git push
